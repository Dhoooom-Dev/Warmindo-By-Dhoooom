{% extends "base.html" %}{% block content %}<div class="topline"><div><div class="title">Recipe / BOM</div><div class="subtitle">BOM = bahan yang otomatis dikurangi saat menu terjual.</div></div></div><div class="line"></div>
<div class="card"><h3>Tambah / Update Recipe BOM</h3><form method="post" class="formrow"><select class="select" name="product_id">{% for p in products %}<option value="{{p.id}}">{{p.name}}</option>{% endfor %}</select><select class="select" name="ingredient_id">{% for i in ingredients %}<option value="{{i.id}}">{{i.name}} ({{i.unit}})</option>{% endfor %}</select><input class="input" name="qty" type="number" step="any" min="0" placeholder="Qty per 1 porsi" required><button class="btn">Simpan BOM</button></form></div>
<div class="card" style="margin-top:15px"><table class="table"><tr><th>MENU</th><th>BAHAN</th><th>QTY / MENU</th><th></th></tr>{% for x in rows %}<tr><td>{{x.product}}</td><td>{{x.ingredient}}</td><td>{{x.qty|qty}} {{x.unit}}</td><td><form method="post" action="{{url_for('recipe_delete',bid=x.id)}}"><button class="btn small red">Hapus</button></form></td></tr>{% endfor %}</table></div>{% endblock %}
